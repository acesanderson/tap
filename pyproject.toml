[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tap"
version = "0.1.0"
description = "for now, the poor man's siphon and a replacement for obsidian's bad search. Eventually: a shell, with MCP, my replacement for claude desktop."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.3.0",
    "dbclients",
    "headwater_api",
    "pyaudio>=0.2.14",
    "pydub>=0.25.1",
    "pytesseract>=0.3.13",
    "rapidfuzz>=3.14.1",
    "sentence-transformers>=5.1.1",
    "xdg-base-dirs>=6.0.2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/tap"]
sources = ["src"]
include = ["src/tap/py.typed"]

# ── uv sources (local/editable deps) ───────────────────────────────────────────
[tool.uv.sources]
dbclients = { path = "../dbclients-project", editable = true }
headwater_api = { path = "../headwater/headwater-api", editable = true }
siphon_api = { path = "../siphon/siphon-api", editable = true }

# ── Scripts ────────────────────────────────────────────────────────────────────
[project.scripts]
tap = "tap.cli.main:main"
ocr = "tap.scripts.ocr_cli:main"
peek = "tap.scripts.peek_cli:main"
play = "tap.scripts.play_cli:main"
record = "tap.scripts.record_cli:main"
survey = "tap.scripts.survey_cli:main"
flatten = "tap.scripts.flatten_cli:main"
manpage = "tap.scripts.shortcuts:manpage_entrypoint" # flatten alias
readme = "tap.scripts.shortcuts:readme_entrypoint" # flatten alias
url = "tap.scripts.url_cli:main"
